[package]
name = "soundboard-desktop"
version = "0.1.0"
description = "ScreamPad: cross-platform desktop soundboard"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "soundboard_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Release candidates, pinned exactly (ADR 0004). specta derives stay in the IPC adapter DTOs under `commands`.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
# ADR 0005. rusqlite_migration 2.6.0 requires rusqlite ^0.40, so 0.41 is not used yet.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
