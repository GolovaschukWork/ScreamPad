name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # hashFiles() is not allowed in job-level conditions, so gate the steps instead.
      - name: Detect TypeScript sources
        id: sources
        run: |
          if [ -n "$(git ls-files 'src/*.ts' 'src/*.tsx')" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No TypeScript sources yet; skipping CodeQL analysis."
          fi
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: steps.sources.outputs.present == 'true'
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: steps.sources.outputs.present == 'true'
